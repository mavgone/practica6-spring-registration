spring:
  application:
    name: demo
  
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  
  thymeleaf:
    prefix: classpath:/View/pages/
    suffix: .html
  
  web:
    resources:
      static-locations: classpath:/static/
  
  h2:
    console:
      enabled: true
      path: /h2-console  
  
  datasource:
    url: jdbc:h2:file:./data/demo
    driver-class-name: org.h2.Driver
    username: sa
    password: 


server:
  port: 8080
  servlet:
    session:
      tracking-modes: cookie
